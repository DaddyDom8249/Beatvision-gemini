name: BeatVision Android Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit and Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Debug APK build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Screenshot verification
        run: ./gradlew :app:verifyRoborazziDebug --no-daemon --stacktrace
